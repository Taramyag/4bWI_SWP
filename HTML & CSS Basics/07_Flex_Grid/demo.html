<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: red;
            padding: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            grid-auto-rows: minmax(100px, auto);
            column-gap: 1px;
            row-gap: 1px;
        }

        .item1 {
            grid-column-start: span 3;
            grid-row-start: span 3;
        }

        .item5 {
            grid-column-start: span 3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box item1">eins</div>
        <div class="box item2">eins</div>
        <div class="box item3">eins</div>
        <div class="box item4">eins</div>
        <div class="box item5">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Iusto debitis odio, doloremque
            ullam magnam omnis officia sequi! Voluptas aliquam dignissimos sint fugiat amet! Alias voluptatem molestias
            impedit ad nostrum odio!</div>

    </div>
</body>

</html>
