<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: red;
            width: 100px;
            height: 100px;
            margin: 5px;
        }

        .container {

            background-color: green;
            display: flex;
            height: 400px;
            flex-direction: row;
            justify-content: space-between;
            align-items: last baseline;
        }


        .box2 {

            background-color: yellow;
            width: 100px;
            height: 100px;
            margin: 5px;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">eins</div>
        <div class="box">zwei</div>
        <div class="box">drei</div>
        <div class="box2">vier</div>
        <div class="box2">fünf</div>
        <div class="box2">sechs</div>

    </div>


</body>

</html>
